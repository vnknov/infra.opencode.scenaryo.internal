services:
  devbox:
    build:
      context: .
      args:
        USERNAME: dev

    container_name: devbox
    hostname: devbox

    ports:
      - "2222:22"

    environment:
      NODE_EXTRA_CA_CERTS: /certs/root-ca.crt

    volumes:
      # Workspace
      - ${WORKSPACE:-/home/miniai1/devbox/workspace}:/home/dev/workspace

      # Persistent home shared with OpenCode
      - devbox-home:/home/dev

      # SSH keys mounted read-only outside /home/dev
      - ${KEY_STORE:-/home/miniai1/devbox/keys}:/run/devbox-keys:ro

      # Internal CA
      - ${CERT_STORE:-/home/miniai1/devbox/certs}/root-ca.crt:/certs/root-ca.crt:ro

      # Optional storage
      # - /mnt/t9:/mnt/t9:ro

    restart: unless-stopped

    networks:
      - ocnet

    command:
      - bash
      - -c
      - |
        set -e

        mkdir -p /home/dev/.ssh
        chown dev:dev /home/dev/.ssh
        chmod 700 /home/dev/.ssh

        install \
          -o dev \
          -g dev \
          -m 600 \
          /run/devbox-keys/laptop.pub \
          /home/dev/.ssh/authorized_keys

        install \
          -o dev \
          -g dev \
          -m 600 \
          /run/devbox-keys/github/id_ed25519 \
          /home/dev/.ssh/github_key

        install \
          -o dev \
          -g dev \
          -m 644 \
          /run/devbox-keys/github/id_ed25519.pub \
          /home/dev/.ssh/github_key.pub

        exec /usr/sbin/sshd -D


  opencode:
    build:
      context: .
      args:
        USERNAME: dev

    container_name: opencode
    hostname: opencode

    user: dev
    working_dir: /home/dev/workspace

    environment:
      HOME: /home/dev

      OPENCODE_SERVER_USERNAME: vince
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD}

      OPEN_API_KEY: ${OPEN_API_KEY}
      CHANNELS_MCP_TOKEN: ${CHANNELS_MCP_TOKEN}
      LM_STUDIO_TOKEN: ${LM_STUDIO_TOKEN}
      OBSIDIAN_API_KEY: ${OBSIDIAN_API_KEY}

      NODE_EXTRA_CA_CERTS: /certs/root-ca.crt

    volumes:
      # OpenCode configuration
      - ./opencode.json:/home/dev/.config/opencode/opencode.json:ro

      # Workspace
      - ${WORKSPACE:-/home/miniai1/devbox/workspace}:/home/dev/workspace

      # Persistent home shared with devbox.
      # This also preserves OpenCode auth/session data.
      - devbox-home:/home/dev

      # Internal CA
      - ${CERT_STORE:-/home/miniai1/devbox/certs}/root-ca.crt:/certs/root-ca.crt:ro

      # Optional storage
      # - /mnt/t9:/mnt/t9:ro

    restart: unless-stopped

    networks:
      - ocnet

    expose:
      - "4096"

    command:
      - bash
      - -c
      - |
        eval $(ssh-agent -s) &&
        ssh-add /home/dev/.ssh/github_key 2>/dev/null ||
        true &&
        exec opencode serve \
          --hostname 0.0.0.0 \
          --port 4096

    extra_hosts:
      - "vmserver.scenaryo.internal:192.168.42.41"


  caddy:
    image: caddy:2

    container_name: caddy

    restart: unless-stopped

    ports:
      - "443:443"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

    networks:
      - ocnet

    depends_on:
      - opencode


networks:
  ocnet:


volumes:
  devbox-home:
  caddy_data:
  caddy_config:
